# WSL guest configuration. This file is not used on native Ubuntu installs.
#
# Opinionated path layout: Windows drives mount at /c, /d, and so on instead
# of WSL's default /mnt/c, /mnt/d layout.
[automount]
enabled = true
mountFsTab = true
root = /
# options = "metadata,umask=22,fmask=11"

[boot]
systemd = true
# command = service docker start

[interop]
enabled = true
# Keep Windows executables off the Linux PATH.
appendWindowsPath = false

# Keep WSL's default host and DNS generation behavior explicit.
[network]
generateHosts = true
generateResolvConf = true
# hostname = wsl

# Opinionated administrative WSL setup. Remove this section to use the
# distribution's configured default user instead.
[user]
default = root
